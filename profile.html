<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BloodConnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a class="logo" href="index.html"> <span>🩸</span> Blood-Connect </a>
        <nav><a class="active" href="index.html">Home</a>
            <a href="find-blood.html">Find blood</a>
            <a href="blood-request.html">Request blood</a>
            <a href="donor-registration.html">Donor registration</a>
            <a href="donor-details.html">Donor details</a>
            <a href="profile.html">Profile</a>

        </nav>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>

    </header>
    <main>
        <section class="section">
            <div class="section-head">
                <div>
                    <p class="eyebrow">My Profile</p>
                    <h2>Blood-Connect profile</h2>
                </div>
                <p> Save your profile information in this page</p>
            </div>
            <div class="form-card">
               
                <div class="form-grid">
                    <label>Full Name <input id="profileName" type="text" placeholder="Enter your name"></label>
                    <label>Phone Number <input id="profilePhone" type="tel" placeholder="01XXXXXXXXX"></label>
                    <label>Blood Group
                        <select id="profileBlood">
                            <option value="">select group</option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>
                        </select>
                    </label>
                    <label>City / Area <input id="profileLocation" type="text" placeholder="kapasia,Gazipur"></label>
                </div>
                <button class="btn primary" type="button" onclick="saveProfile()">Save Profile</button>
            </div>
            <section class="section" style="padding-left:0;padding-right:0;">
                <div class="section-head">
                    <div>
                        <p class="eyebrow">about me</p>
                        <h2>About me</h2>
                        <p>Tell us about yourself</p>
                    </div>
                </div>
                <div id="profileSummary" class="cards"></div>
            </section>
        </section>
    </main>

    <footer class="footer">
        <div> <a class="logo" href="index.html"> <span>❤</span> Blood-connect </a>
            <p>Techonology for a healthier community.</p>
        </div>
        <p>Stay with BloodConnect </p>

    </footer>
    <div id="toast" class="toast">

    </div>

    <script src="script.js"></script>

</body>

</html>
