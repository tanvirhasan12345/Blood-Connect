<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Donor - BloodConnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a class="logo" href="index.html"> <span>🩸</span> Blood-Connect </a>
        <nav><a class="active" href="index.html">Home</a>
            <a href="find-blood.html">Find blood</a>
            <a href="blood-request.html">Request blood</a>
            <a href="donor-registration.html">Donor registration</a>
            <a href="donor-details.html">Donor details</a>
            <a href="profile.html">Profile</a>

        </nav>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>

    </header>

    <main>
        <section class="section tinted">
            <div class="section-head">
                <div>
                    <p class="eyebrow">Join our community</p>
                    <h2>Become a blood donor</h2>
                </div>
                <p>Please register your details to become a donor that helps other for find you</p>
            </div>
            <form id="donorForm" class="form-card">
                <div class="form-grid">
                    <label>Full Name <input required id="name" type="text" placeholder="Enter your name"></label>
                    <label>Phone Number <input required id="phone" type="tel" placeholder="01XXXXXXXXX"></label>
                    <label>Blood Group<select required id="blood">
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>
                        </select></label>
                    <label>City / Area<input required id="location" type="text"
                            placeholder="e.g. kapasia,Gazipur"></label>
                    <label>Last Donation Date<input id="lastDonation" type="date"></label>
                    <label>Availability<select id="availability">
                            <option>Available</option>
                            <option>Unavailable</option>
                        </select></label>
                </div>
                <button class="btn primary" type="submit">Submit</button>
            </form>
        </section>


    </main>
    <footer class="footer">
        <div> <a class="logo" href="index.html"> <span>❤</span> Blood-connect </a>
            <p>Techonology for a healthier community.</p>
        </div>
        <p>Stay with BloodConnect </p>

    </footer>
    <div id="toast" class="toast">

    </div>

    <script src="script.js"></script>

</body>

</html>
